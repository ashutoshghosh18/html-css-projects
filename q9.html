<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #111827;
            color: white;
        }

        .box {
            width: 350px;
            background-color: #1f2937;
            padding: 35px;
            margin: 100px auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px #000;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
        }

        p {
            color: #9ca3af;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            background-color: #374151;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 6px;
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            width: 96%;
            padding: 12px;
            margin-top: 15px;
            background-color: #38bdf8;
            color: #111827;
            border: none;   
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0ea5e9;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Welcome Back</h1>

        <p>Login to your account</p>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
