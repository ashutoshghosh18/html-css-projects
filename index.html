<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .internal {
            background-color: lightgreen;
        }

        .internal h2 {
            color: green;
        }
    </style>
</head>

<body>

    <h1>Types of CSS</h1>

    <div style="background-color: lightpink;">
        <h2 style="color: red;">Inline CSS</h2>
        <p>This background and heading color are changed using inline CSS.</p>
    </div>

    <br>

    <div class="internal">
        <h2>Internal CSS</h2>
        <p>This background and heading color are changed using internal CSS.</p>
    </div>

    <br>

    <div class="external">
        <h2>External CSS</h2>
        <p>This background and heading color are changed using external CSS.</p>
    </div>

</body>
</html>
