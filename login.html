<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <!-- Center tag balances it on the page naturally -->
    <center>
        <form>
            <!-- Fieldset creates a clean box around the inputs automatically -->
            <fieldset style="width: 280px; padding: 20px;">
                <legend><h3><b>Account Login</b></h3></legend>
                
                <p align="left">
                    <label><b>Username</b></label><br>
                    <input type="text" name="username" placeholder="Enter your username" size="30">
                </p>
                
                <p align="left">
                    <label><b>Password</b></label><br>
                    <input type="password" name="password" placeholder="Enter your password" size="30">
                </p>
                
                <hr>
                
                <p>
                    <input type="submit" value="Sign In">
                    <input type="reset" value="Clear">
                </p>
            </fieldset>
        </form>
    </center>

</body>
</html>
